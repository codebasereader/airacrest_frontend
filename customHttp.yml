# Amplify Hosting redirects / rewrites
# Order matters: specific rules first, SPA fallback last.

customHeaders:
  # Force HTTPS on every future request (~1yr) so browsers/QR scanners never
  # make the first hit over plain HTTP - that HTTP hop is what triggers
  # Chrome's "File can't be downloaded securely" on the /sri and /connect
  # vCard links.
  - pattern: "**"
    headers:
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains; preload"
  # Product/home HTML must not stay cached after a deploy, or buyers keep
  # seeing the previous header/footer WhatsApp numbers and labels.
  - pattern: "**/*.html"
    headers:
      - key: "Cache-Control"
        value: "no-cache, no-store, must-revalidate"
      - key: "Pragma"
        value: "no-cache"
  - pattern: "/"
    headers:
      - key: "Cache-Control"
        value: "no-cache, no-store, must-revalidate"
      - key: "Pragma"
        value: "no-cache"
  # /sri and /connect are now on-screen contact cards (React routes) with a
  # "Save Contact" button that links straight to these .vcf files. Content-
  # type must stay text/vcard so phones treat it as a contact, and
  # Content-Disposition is "attachment" so the button click downloads it
  # instead of navigating the page there.
  - pattern: "/sri.vcf"
    headers:
      - key: "Content-Type"
        value: "text/vcard; charset=utf-8"
      - key: "Content-Disposition"
        value: "attachment; filename=\"sri.vcf\""
      - key: "Cache-Control"
        value: "public, max-age=300"
  - pattern: "/connect.vcf"
    headers:
      - key: "Content-Type"
        value: "text/vcard; charset=utf-8"
      - key: "Content-Disposition"
        value: "attachment; filename=\"connect.vcf\""
      - key: "Cache-Control"
        value: "public, max-age=300"

redirects:
  # Serve Search Console verification + SEO files as-is (never rewrite to index.html)
  - source: "/google775ce10030c74b40.html"
    target: "/google775ce10030c74b40.html"
    status: "200"
  - source: "/robots.txt"
    target: "/robots.txt"
    status: "200"
  - source: "/sitemap.xml"
    target: "/sitemap.xml"
    status: "200"

  # Force apex → www for all paths
  - source: "https://airacrest.com"
    status: "301"
    target: "https://www.airacrest.com"
  - source: "https://airacrest.com/<*>"
    status: "301"
    target: "https://www.airacrest.com/<*>"

  # SPA fallback for routes without a static file
  - source: "/<*>"
    target: "/index.html"
    status: "404-200"
