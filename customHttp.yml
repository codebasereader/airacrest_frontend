# Amplify Hosting redirects / rewrites
# Order matters: specific rules first, SPA fallback last.

customHeaders:
  # Product/home HTML must not stay cached after a deploy, or buyers keep
  # seeing the previous header/footer WhatsApp numbers and labels.
  - pattern: "**/*.html"
    headers:
      - key: "Cache-Control"
        value: "no-cache, no-store, must-revalidate"
      - key: "Pragma"
        value: "no-cache"
  - pattern: "/"
    headers:
      - key: "Cache-Control"
        value: "no-cache, no-store, must-revalidate"
      - key: "Pragma"
        value: "no-cache"
  # Printed QR codes point at /sri and /connect, which rewrite to these
  # files - match the served file path, not the pre-rewrite request path,
  # or the header rule never fires. Content-type must stay text/vcard so
  # phones offer "Add Contact" instead of downloading text.
  - pattern: "/sri.vcf"
    headers:
      - key: "Content-Type"
        value: "text/vcard; charset=utf-8"
      - key: "Content-Disposition"
        value: "inline; filename=\"sri.vcf\""
      - key: "Cache-Control"
        value: "public, max-age=300"
  - pattern: "/connect.vcf"
    headers:
      - key: "Content-Type"
        value: "text/vcard; charset=utf-8"
      - key: "Content-Disposition"
        value: "inline; filename=\"connect.vcf\""
      - key: "Cache-Control"
        value: "public, max-age=300"

redirects:
  # Serve Search Console verification + SEO files as-is (never rewrite to index.html)
  - source: "/google775ce10030c74b40.html"
    target: "/google775ce10030c74b40.html"
    status: "200"
  - source: "/robots.txt"
    target: "/robots.txt"
    status: "200"
  - source: "/sitemap.xml"
    target: "/sitemap.xml"
    status: "200"

  # Printed QR codes (business cards/letterheads) - must stay permanent.
  # Rewrite (not redirect) so the printed URL never changes.
  - source: "/sri"
    target: "/sri.vcf"
    status: "200"
  - source: "/connect"
    target: "/connect.vcf"
    status: "200"

  # Force apex → www for all paths
  - source: "https://airacrest.com"
    status: "301"
    target: "https://www.airacrest.com"
  - source: "https://airacrest.com/<*>"
    status: "301"
    target: "https://www.airacrest.com/<*>"

  # SPA fallback for routes without a static file
  - source: "/<*>"
    target: "/index.html"
    status: "404-200"
